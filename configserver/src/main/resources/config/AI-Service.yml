server:
  port: 7000


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://eurekaserver:8070/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true


info:
  app:
    name: "AI Service"
    description: "Testcase Generator AI Service Application "
    version: "1.0.0"

logging:
  level:
    com:
      tefal:
        projects: DEBUG
