server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    url: jdbc:mysql://projectsdb:3306/projectsdb
  jpa:
    show-sql: true
    sql:
      init:
        mode: always
    hibernate:
      ddl-auto: update

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://eurekaserver:8070/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true


info:
  app:
    name: "projects"
    description: "Testcase Generator Projects Application "
    version: "1.0.0"

logging:
  level:
    com:
      tefal:
        projects: DEBUG



