spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3307/requirementdb
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 9000

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true


info:
  app:
    name: "requirement"
    description: "Testcase Generator Requirement Application "
    version: "1.0.0"

logging:
  level:
    com:
      tefal:
        projects: DEBUG

