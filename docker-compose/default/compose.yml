services:

  configserver:
    image: "m07amed66/configserver:v1"
    build: ../../configserver
    container_name: configserver-ms
    ports:
      - "8071:8071"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    extends:
      file: common-config.yml
      service: microservice-base-config
    networks:
      - testcase-network

  eurekaserver:
    image: "m07amed66/eurekaserver:v1"
    build: ../../eurekaserver
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      SPRING_APPLICATION_NAME: eurekaserver
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    networks:
      - testcase-network

  gatewayserver:
    image: "m07amed66/gatewayserver:v1"
    build: ../../gatewayserver
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"

    depends_on:
      eurekaserver:
        condition: service_healthy
      projects:
        condition: service_healthy
      requirement:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      testcase:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: gatewayserver
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - testcase-network

  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - testcase-network

  projects:
    image: "m07amed66/projects:v1"
    build: ../../projects
    container_name: projects-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      SPRING_APPLICATION_NAME: projects
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/projectsdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - testcase-network

  requirement:
    image: "m07amed66/requirement:v1"
    build: ../../requirement
    container_name: requirement-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      testcase:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      SPRING_APPLICATION_NAME: requirement
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/requirementsdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - testcase-network

  testcase:
    image: "m07amed66/testcase:v1"
    build: ../../testcase
    container_name: testcase-ms
    ports:
      - "9090:9090"
    depends_on:
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:9090/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      SPRING_APPLICATION_NAME: testcase
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/testcasedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - testcase-network

  ai-model:
    image: "ibrahimrageh17/test-case-generator:v1"
    container_name: ai-model
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8000/docs || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - testcase-network

  ai-service:
    image: "m07amed66/ai-service:v1"
    build: ../../AI-Service
    container_name: ai-service-ms
    ports:
      - "7000:7000"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      ai-model:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:7000/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      SPRING_APPLICATION_NAME: ai-service
      SERVER_PORT: 7000
      AI_MODEL_URL: http://ai-model:8000/generate
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - testcase-network

networks:
  testcase-network:
